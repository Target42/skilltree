# Loaded automatically from http {} (Debian/Ubuntu: include conf.d/*.conf).
# Safe to ship enabled: only defines upstream + rate-limit zones.

upstream skilltree_app {
    server 127.0.0.1:8088;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=skilltree_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=skilltree_conn:10m;
